services:
  media-gateway:
    image: bluenviron/mediamtx@sha256:206139c58377b7544d6ef63f8af86bcf46b9e89262aaa6f7513e1347dbab7d36
    restart: unless-stopped
    networks: [media-private]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${GW_PUBLIC_HOST:?set GW_PUBLIC_HOST to the LAN gateway host}
    ports:
      - "${GW_BIND_HOST:-0.0.0.0}:8189:8189/udp"
    expose: ["8554", "8889", "9997"]
    volumes:
      - ../runtime/config/mediamtx.yml:/mediamtx.yml:ro

networks:
  media-private:
    internal: true
