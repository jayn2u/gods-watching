services:
  media-gateway:
    image: bluenviron/mediamtx@sha256:206139c58377b7544d6ef63f8af86bcf46b9e89262aaa6f7513e1347dbab7d36
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${GW_PUBLIC_HOST:?set GW_PUBLIC_HOST to the LAN gateway host}
      MTX_APIADDRESS: 127.0.0.1:${GW_MEDIA_CONTROL_PORT:-9997}
      MTX_RTSPADDRESS: 127.0.0.1:${GW_MEDIA_RTSP_PORT:-8554}
      MTX_WEBRTCADDRESS: 127.0.0.1:${GW_MEDIA_WHEP_PORT:-8889}
      MTX_WEBRTCLOCALUDPADDRESS: ${GW_BIND_HOST:-0.0.0.0}:${GW_MEDIA_UDP_PORT:-8189}
    network_mode: host
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ../runtime/config/mediamtx.yml:/mediamtx.yml:ro
