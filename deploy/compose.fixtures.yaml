x-fixture-publisher: &fixture-publisher
  image: jrottenberg/ffmpeg@sha256:9692b2603309ff0cad1ebba473f114229834ce3e7df64ebc3a1a322121d7981f
  entrypoint: ["/bin/sh", "/opt/gods-watching/publish-loop.sh"]
  restart: unless-stopped
  depends_on:
    fixture-mediamtx:
      condition: service_started
  networks: [fixture-media]
  profiles: [fixtures]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:
    - ../server/src/gods_watching/fixtures/publish-loop.sh:/opt/gods-watching/publish-loop.sh:ro

services:
  fixture-mediamtx:
    image: bluenviron/mediamtx@sha256:206139c58377b7544d6ef63f8af86bcf46b9e89262aaa6f7513e1347dbab7d36
    restart: unless-stopped
    networks: [fixture-media]
    profiles: [fixtures]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ../server/src/gods_watching/fixtures/mediamtx-fixtures.yml:/mediamtx.yml:ro

  fixture-camera-1:
    <<: *fixture-publisher
    environment:
      FIXTURE_INPUT: /fixture/input.mp4
      FIXTURE_PATH: camera-1
      RTSP_HOST: fixture-mediamtx
    volumes:
      - ../server/src/gods_watching/fixtures/publish-loop.sh:/opt/gods-watching/publish-loop.sh:ro
      - ../runtime/assets/fixtures/business-plaza.mp4:/fixture/input.mp4:ro

  fixture-camera-2:
    <<: *fixture-publisher
    environment:
      FIXTURE_INPUT: /fixture/input.mp4
      FIXTURE_PATH: camera-2
      RTSP_HOST: fixture-mediamtx
    volumes:
      - ../server/src/gods_watching/fixtures/publish-loop.sh:/opt/gods-watching/publish-loop.sh:ro
      - ../runtime/assets/fixtures/crosswalk.mp4:/fixture/input.mp4:ro

  fixture-camera-3:
    <<: *fixture-publisher
    environment:
      FIXTURE_INPUT: /fixture/input.mp4
      FIXTURE_PATH: camera-3
      RTSP_HOST: fixture-mediamtx
    volumes:
      - ../server/src/gods_watching/fixtures/publish-loop.sh:/opt/gods-watching/publish-loop.sh:ro
      - ../runtime/assets/fixtures/night-market.mp4:/fixture/input.mp4:ro

  fixture-camera-4:
    <<: *fixture-publisher
    environment:
      FIXTURE_INPUT: /fixture/input.mp4
      FIXTURE_PATH: camera-4
      RTSP_HOST: fixture-mediamtx
    volumes:
      - ../server/src/gods_watching/fixtures/publish-loop.sh:/opt/gods-watching/publish-loop.sh:ro
      - ../runtime/assets/fixtures/barcelona-boulevard.mp4:/fixture/input.mp4:ro

networks:
  fixture-media:
    internal: true
