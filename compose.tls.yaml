services:
  api:
    environment:
      GW_PUBLIC_ORIGIN: https://${GW_PUBLIC_HOST:?set the LAN host or IP}:8443
      GW_SECURE_COOKIE: "true"

  gateway:
    environment:
      GW_PUBLIC_HOST: ${GW_PUBLIC_HOST:?set the LAN host or IP}
    ports: !override
      - "${GW_BIND_HOST:-0.0.0.0}:8080:8080"
      - "${GW_BIND_HOST:-0.0.0.0}:8443:8443"
    tmpfs: !override [/config, /tmp]
    volumes: !override
      - ./deploy/Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
