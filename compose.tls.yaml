services:
  api:
    environment:
      GW_PUBLIC_ORIGIN: https://${GW_PUBLIC_HOST:?set the LAN host or IP}:${GW_PUBLIC_TLS_PORT:-8443}
      GW_SECURE_COOKIE: "true"

  gateway:
    environment:
      GW_API_PORT: ${GW_API_PORT:-18000}
      GW_BIND_HOST: ${GW_BIND_HOST:-0.0.0.0}
      GW_PUBLIC_HOST: ${GW_PUBLIC_HOST:?set the LAN host or IP}
      GW_PUBLIC_PORT: ${GW_PUBLIC_PORT:-8080}
      GW_PUBLIC_TLS_PORT: ${GW_PUBLIC_TLS_PORT:-8443}
    tmpfs: !override [/config, /tmp]
    volumes: !override
      - ./deploy/Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
