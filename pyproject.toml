[project]
name = "gods-watching"
version = "0.1.0"
description = "A recording-free RTSP person search research server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "anyio==4.10.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.30.0",
    "click==8.4.0",
    "cryptography==45.0.7",
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.43",
    "typer==0.17.4",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
gods-watching-cli = "gods_watching.cli:main"

[dependency-groups]
dev = [
    "basedpyright==1.31.4",
    "pytest==8.4.2",
    "ruff==0.12.12",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/src/gods_watching"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["server/src", "server/tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server/src", "server/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "TD002", "TD003", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"server/tests/**/*.py" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["server/tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
